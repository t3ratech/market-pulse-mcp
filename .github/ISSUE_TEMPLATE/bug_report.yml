name: Bug report
description: A tool returned the wrong thing, failed, or its description misled a model.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npx @t3ratech/market-pulse-mcp --version` is not available; paste the version from your lockfile or `npm ls`.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Claude Code, Claude Desktop, Cursor, Cline, …
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The tool name, the arguments (never paste your API key), and the response or error.
    validations:
      required: true
