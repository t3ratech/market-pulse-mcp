# MCPize manifest — https://mcpize.com
#
# The MCPize listing is the managed, paid way to use Market Pulse from an MCP client:
# subscribers pay MCPize, and calls reach the service through the publisher's own
# Market Pulse key (a secret below), so a subscriber needs no Market Pulse account.
# The npm package stays free and keyless for anyone who prefers to run it themselves.
# Grades are never for sale on either path — paid access buys delivery, not verdicts.
version: 1
runtime: container
startCommand:
  type: stdio
  command: node
  args:
    - src/server.js
secrets:
  - name: MARKET_PULSE_API_KEY
    required: true
    description: Publisher's Market Pulse API key, used for every subscriber call.
